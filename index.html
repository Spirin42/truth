<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>truth</title>
<!-- The page itself at 16px: the white word in the dark, already
     scattering from its end. Inline, so only the sky is a separate file. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307080d'/%3E%3Crect x='5' y='14' width='13' height='4' rx='2' fill='%23fff'/%3E%3Cg fill='%23fff'%3E%3Crect x='19.5' y='13' width='2' height='2' opacity='.85'/%3E%3Crect x='22.5' y='16.5' width='1.6' height='1.6' opacity='.7'/%3E%3Crect x='21.5' y='10' width='1.4' height='1.4' opacity='.55'/%3E%3Crect x='25' y='12.5' width='1.4' height='1.4' opacity='.5'/%3E%3Crect x='25.5' y='19' width='1.2' height='1.2' opacity='.4'/%3E%3Crect x='27.5' y='9' width='1' height='1' opacity='.35'/%3E%3C/g%3E%3C/svg%3E"/>
<style>
  html, body { height: 100%; }
  /* no pan, no zoom, no bounce: a finger sliding across the page has to
     keep reporting where it is, or it could never reach the word */
  html{ touch-action: none; }
  body{
    margin: 0;
    /* the sky before the photograph arrives: a deep field is mostly this */
    background: #04050a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    color: #ffffff;
    -webkit-font-smoothing: antialiased;
    /* nothing on this page can be taken away from it */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }

  /* Webb's first deep field, cropped for each orientation so that the
     cluster and its arcs hang above the word instead of behind it. It
     drifts, slowly; the scale always exceeds twice the shift, so the
     drift never shows an edge. */
  .sky{
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  .sky img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.6s ease;
    animation: drift 70s ease-in-out infinite alternate;
    will-change: transform;
  }
  .sky img.in{ opacity: 1; }
  @keyframes drift{
    from{ transform: scale(1.08) translate(-1.6%, 1%); }
    to  { transform: scale(1.14) translate(1.6%, -1%); }
  }

  .truth{
    position: relative;
    padding: .35em .5em;
    font-size: min(184px, 30vw, 40vh);
    line-height: 1.25;
    opacity: 0;
    animation: appear 1.1s ease .15s forwards;
  }
  @keyframes appear{ to{ opacity: 1; } }

  .word{
    display: block;
    white-space: nowrap;
  }

  /* the dust the word turns into */
  .dust{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .sr{
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .truth{ animation-duration: .4s; }
    .sky img{ animation: none; transform: scale(1.08); }
  }
</style>
</head>
<body>
<!-- Public domain: NASA, ESA, CSA, STScI. See README.md. Each crop comes
     in two widths; sizes allows for the drift's extra 14%. -->
<picture class="sky">
  <source media="(min-aspect-ratio: 1/1)" type="image/avif"
          srcset="sky/land-1920.avif 1920w, sky/land-2880.avif 2880w"
          sizes="(min-aspect-ratio: 8/5) 114vw, 183vh"/>
  <source media="(min-aspect-ratio: 1/1)" type="image/webp"
          srcset="sky/land-1920.webp 1920w, sky/land-2880.webp 2880w"
          sizes="(min-aspect-ratio: 8/5) 114vw, 183vh"/>
  <source type="image/avif"
          srcset="sky/port-1080.avif 1080w, sky/port-1600.avif 1600w"
          sizes="(max-aspect-ratio: 9/16) 63vh, 114vw"/>
  <source type="image/webp"
          srcset="sky/port-1080.webp 1080w, sky/port-1600.webp 1600w"
          sizes="(max-aspect-ratio: 9/16) 63vh, 114vw"/>
  <img src="sky/land-1920.webp" alt="" decoding="async" fetchpriority="high"/>
</picture>
<main class="truth"><span class="word" aria-hidden="true">Truth</span><span class="sr">Truth</span></main>
<canvas class="dust" aria-hidden="true"></canvas>

<script>
(function(){
  'use strict';
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rnd(a, b){ return a + Math.random() * (b - a); }

  var stage = document.querySelector('.truth');
  var word = stage.querySelector('.word');
  var canvas = document.querySelector('.dust');
  var ctx = canvas.getContext('2d');

  function em(){ return parseFloat(getComputedStyle(stage).fontSize); }

  /* The photograph fades in over the dark once it is here, cached or not —
     and decoded, or the fade would run its course over nothing and the
     picture would drop in whole at the end of it. */
  (function(){
    var img = document.querySelector('.sky img');
    function lit(){ img.classList.add('in'); }
    function ready(){ (img.decode ? img.decode() : Promise.resolve()).then(lit, lit); }
    if(img.complete && img.naturalWidth) ready();
    else img.addEventListener('load', ready);
  })();

  /* where the baseline runs on the page: an empty box standing on it knows */
  function baseline(){
    var probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
    word.appendChild(probe);
    var y = probe.getBoundingClientRect().top;
    word.removeChild(probe);
    return y;
  }

  /* The dust.

     When the word bursts it is drawn once into a small canvas exactly where
     it stands, and every covered cell of a fine grid becomes a grain with a
     home in the letters. The grains never go out. Once the burst is spent
     they hang in the dark, each drifting round a slow loop of its own, and
     they flee from a hand: a moving cursor, a click, a finger on the glass.
     A cursor at rest frightens nobody.

     Left alone for a second, they go home, each along a smooth path of its
     own length that starts wherever it is, moving however it moves; a hand
     among them on the way scatters them again. When the last grain is in
     its place, the word itself takes over from the dust. */
  var K = 5;          // how fast a burst or a fright dies down, per second
  var MAX = 9000;     // grains at most; the grid widens to keep under it
  var FEAR = 24;      // how hard a hand pushes a grain, em/s², at the hand itself
  var CALM = 1000;    // ms untouched before the grains go home
  var HOT = 120;      // ms a hand stays frightening after it last moved

  var state = 'word'; // word → dust ⇄ gathering → settling → word
  var N = 0, gap0 = 1, size0 = 1, cx0 = 0, cy0 = 0, dpr = 1, raf = 0, last = 0;
  var burstAt = 0, calmSince = 0, gatherAt = 0;
  var PX, PY, VX, VY, HX, HY, TH, TS, TR, A, S, NV, TW, PH, FL, GX, GY, GU, GV, GT;
  var bins = [];
  for(var b = 0; b < 16; b++) bins.push([]);

  function fit(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
    if(canvas.width !== cw || canvas.height !== ch){ canvas.width = cw; canvas.height = ch; }
  }

  /* where the word stands and how large, for the homes to follow it through
     a resize or a turn of the phone */
  function anchor(){
    var r = word.getBoundingClientRect();
    return { r: r, x: (r.left + r.right) / 2, y: (r.top + r.bottom) / 2, size: em() };
  }

  function scatter(ox, oy){
    fit();
    var a = anchor(), r = a.r, size = a.size, cs = getComputedStyle(word);
    var pad = size * .3, base = baseline() - r.top + pad;
    var gap = 1.4, W, H, data, n;
    for(;;){
      var q = 1 / gap;
      W = Math.ceil((r.width + 2 * pad) * q);
      H = Math.ceil((r.height + 2 * pad) * q);
      var off = document.createElement('canvas');
      off.width = W;
      off.height = H;
      var x = off.getContext('2d', { willReadFrequently: true });
      x.setTransform(q, 0, 0, q, 0, 0);
      x.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + size + 'px ' + cs.fontFamily;
      x.fontKerning = 'normal';
      x.textBaseline = 'alphabetic';
      x.fillStyle = '#fff';
      x.fillText(word.textContent, pad, base);
      data = x.getImageData(0, 0, W, H).data;
      n = 0;
      for(var p = 3; p < data.length; p += 4) if(data[p] >= 128) n++;
      if(n <= MAX) break;
      gap *= Math.sqrt(n / MAX) * 1.02;
    }

    N = n;
    function arr(){ return new Float32Array(n); }
    PX = arr(); PY = arr(); VX = arr(); VY = arr(); HX = arr(); HY = arr();
    TH = arr(); TS = arr(); TR = arr(); A = arr(); S = arr(); NV = arr();
    TW = arr(); PH = arr(); FL = arr();
    GX = arr(); GY = arr(); GU = arr(); GV = arr(); GT = arr();
    gap0 = gap; size0 = size; cx0 = a.x; cy0 = a.y;

    /* The nearer a grain to the point of the blow, the harder it flies. The
       blow is held in along whichever side of the screen is short, so on a
       phone, where the word fills the width, the dust goes up and down
       into the room there is rather than into the walls. */
    var V = size * 12, D = size * .8, J = V / 8, k = 0;
    var kx = Math.min(1, K * .45 * innerWidth / V), ky = Math.min(1, K * .45 * innerHeight / V);
    for(var j = 0; j < H; j++) for(var i = 0; i < W; i++){
      if(data[(j * W + i) * 4 + 3] < 128) continue;
      var gx = r.left - pad + (i + Math.random()) * gap;
      var gy = r.top  - pad + (j + Math.random()) * gap;
      var dx = gx - ox, dy = gy - oy, d = Math.sqrt(dx * dx + dy * dy) || 1;
      var burst = V * (.3 + .7 * Math.random()) * Math.pow(1 + d / D, -.6);
      var turn = (Math.random() - .5) * .7, c = Math.cos(turn), s = Math.sin(turn);
      HX[k] = PX[k] = gx;
      HY[k] = PY[k] = gy;
      VX[k] = ((dx * c - dy * s) / d * burst + (Math.random() - .5) * J) * kx;
      VY[k] = ((dx * s + dy * c) / d * burst + (Math.random() - .5) * J) * ky;
      TH[k] = Math.random() * 2 * Math.PI;                        // the way it drifts,
      TS[k] = rnd(3, 12);                                         // how fast, px/s,
      TR[k] = (Math.random() < .5 ? -1 : 1) * rnd(.15, .5);      // and how fast that way turns
      A[k] = rnd(.6, 1);
      S[k] = rnd(1.1, 2.3) / dpr;   // never under a device pixel: finer, a grain goes grey
      NV[k] = rnd(.6, 1.4);         // how easily it takes fright
      TW[k] = rnd(1, 3);
      PH[k] = Math.random() * 2 * Math.PI;
      k++;
    }
  }

  function frame(now){
    raf = 0;
    var dt = Math.min(.033, Math.max(0, (now - last) / 1000));
    last = now;
    var W = innerWidth, H = innerHeight;
    var hot = ptr.down || now - ptr.moved < HOT;
    var R = size0 * (ptr.touch ? 1.1 : .8), R2 = R * R, F = FEAR * size0;
    var kd = 1 - Math.exp(-K * dt);
    var fb = Math.exp(-(now - burstAt) / 90);
    var gathering = state === 'gathering', tg = (now - gatherAt) / 1000, home = true;
    var touched = false;

    for(var i = 0; i < N; i++){
      var x, y, vx, vy, f;
      if(gathering){
        /* a cubic from where the grain is, moving as it moves, to its home,
           where it arrives at rest: exact, and no tail to wait out */
        var T = GT[i], u = tg / T;
        if(u >= 1) u = 1; else home = false;
        var u2 = u * u, u3 = u2 * u;
        var h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u;
        var d00 = (6 * u2 - 6 * u) / T, d10 = 3 * u2 - 4 * u + 1;
        x = h00 * GX[i] + h10 * T * GU[i] + (1 - h00) * HX[i];
        y = h00 * GY[i] + h10 * T * GV[i] + (1 - h00) * HY[i];
        vx = d00 * (GX[i] - HX[i]) + d10 * GU[i];
        vy = d00 * (GY[i] - HY[i]) + d10 * GV[i];
        /* nearly home, it swells back to fill its cell of the letter */
        f = u < .55 ? 0 : (u - .55) / .45;
        f = f * f * (3 - 2 * f);
      } else {
        x = PX[i];
        y = PY[i];
        /* its own slow loop: the heading turns a little every moment */
        var th = TH[i] += TR[i] * dt;
        var sx = Math.cos(th) * TS[i], sy = Math.sin(th) * TS[i];
        vx = VX[i] + (sx - VX[i]) * kd;
        vy = VY[i] + (sy - VY[i]) * kd;
        /* just after the burst the grains still fill the letters */
        f = fb;
      }
      if(hot){
        var dx = x - ptr.x, dy = y - ptr.y, d2 = dx * dx + dy * dy;
        if(d2 < R2){
          var d = Math.sqrt(d2) || .01, q = 1 - d / R;
          q = F * NV[i] * q * q * dt / d;
          vx += dx * q;
          vy += dy * q;
          touched = true;
        }
      }
      if(!gathering){
        x += vx * dt;
        y += vy * dt;
        /* The edges of the screen are walls. A grain that reaches one comes
           off it softly, and its drift turns back into the room, so the
           dust never settles along the edges. */
        if(x < 0){ x = -x; vx = Math.abs(vx) * .4; if(sx < 0) TH[i] = Math.PI - th; }
        else if(x > W){ x = 2 * W - x; vx = -Math.abs(vx) * .4; if(sx > 0) TH[i] = Math.PI - th; }
        if(y < 0){ y = -y; vy = Math.abs(vy) * .4; if(sy < 0) TH[i] = -TH[i]; }
        else if(y > H){ y = 2 * H - y; vy = -Math.abs(vy) * .4; if(sy > 0) TH[i] = -TH[i]; }
      }
      PX[i] = x; PY[i] = y; VX[i] = vx; VY[i] = vy; FL[i] = f;
    }

    draw(now / 1000);

    if(touched){
      calmSince = now;
      /* a hand among them on the way home, and they scatter again, each
         carrying on from where and how it was moving */
      if(gathering) state = 'dust';
    } else if(state === 'dust' && now - calmSince >= CALM){
      gather(now);
    } else if(gathering && home){
      settle();
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  function draw(ts){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for(var b = 0; b < 16; b++) bins[b].length = 0;
    for(var i = 0; i < N; i++){
      var f = FL[i];
      /* hanging in the dark a grain glints now and then; filling its cell
         of the letter it shines steadily, as the letter did */
      var a = (A[i] + (1 - A[i]) * f) *
              (1 - .15 * (1 - f) * (.5 + .5 * Math.sin(TW[i] * ts + PH[i])));
      var bin = (a * 16) | 0;
      if(bin > 0) bins[bin > 15 ? 15 : bin].push(i);
    }
    for(b = 1; b < 16; b++){
      var list = bins[b];
      if(!list.length) continue;
      ctx.fillStyle = 'rgba(255,255,255,' + ((b + .5) / 16).toFixed(3) + ')';
      ctx.beginPath();
      for(var j = 0; j < list.length; j++){
        var p = list[j], sz = S[p] + (gap0 - S[p]) * FL[p];
        ctx.rect(PX[p] - sz / 2, PY[p] - sz / 2, sz, sz);
      }
      ctx.fill();
    }
  }

  function gather(now){
    state = 'gathering';
    gatherAt = now;
    for(var i = 0; i < N; i++){
      GX[i] = PX[i];
      GY[i] = PY[i];
      GU[i] = VX[i];
      GV[i] = VY[i];
      var dx = HX[i] - PX[i], dy = HY[i] - PY[i];
      GT[i] = rnd(.8, 1.4) + .5 * Math.min(1, Math.sqrt(dx * dx + dy * dy) / (4 * size0));
    }
  }

  /* every grain home: the word comes back through the dust, the dust goes */
  function settle(){
    state = 'settling';
    word.style.transition = 'opacity 220ms ease';
    word.style.opacity = '';
    canvas.style.transition = 'opacity 220ms ease';
    canvas.style.opacity = '0';
    setTimeout(function(){
      N = 0;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.transition = '';
      canvas.style.opacity = '';
      word.style.transition = '';
      state = 'word';
    }, 240);
  }

  /* The word bursts: the dust is laid down where the letters stand and the
     letters go out in the same instant, so there is no frame between. */
  function explode(px, py){
    if(REDUCED){
      state = 'gone';
      word.style.transition = 'opacity 300ms ease';
      word.style.opacity = '0';
      hush();
      return;
    }
    state = 'dust';
    /* The blow lands between the middle of the word and the side it was
       reached from: off centre enough to throw the dust away from the
       hand, near enough that the word still bursts rather than blows off. */
    var r = word.getBoundingClientRect();
    var cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2;
    scatter(cx + .5 * (Math.min(r.right, Math.max(r.left, px)) - cx),
            cy + .5 * (Math.min(r.bottom, Math.max(r.top, py)) - cy));
    burstAt = calmSince = last = performance.now();
    if(raf) cancelAnimationFrame(raf);
    frame(burstAt);
    word.style.transition = 'none';
    word.style.opacity = '0';
  }

  /* with less motion asked for, the word only goes out, and comes back once
     it has been left alone for as long as the dust would be */
  var quiet = 0;
  function hush(){
    clearTimeout(quiet);
    quiet = setTimeout(function(){
      word.style.transition = 'opacity 400ms ease';
      word.style.opacity = '';
      setTimeout(function(){ word.style.transition = ''; state = 'word'; }, 440);
    }, CALM);
  }

  /* the word can be reached only once it has fully appeared */
  var armed = false;
  function arm(){ armed = true; }
  stage.addEventListener('animationend', arm);
  setTimeout(arm, 1500);

  /* The reach is the word's box scaled by √2 each way about its centre:
     twice its area, in the same proportions. */
  var REACH = Math.SQRT2;
  function inReach(e){
    var r = stage.getBoundingClientRect();
    return Math.abs(e.clientX - (r.left + r.right) / 2) <= r.width  * REACH / 2 &&
           Math.abs(e.clientY - (r.top + r.bottom) / 2) <= r.height * REACH / 2;
  }

  /* One hand, whatever it is. A touch stays with the element it started
     on, so everything is read off the document: a finger sliding in from
     anywhere reaches the word, and the dust, all the same. */
  var ptr = { x: 0, y: 0, moved: -1e9, down: false, touch: false };
  function hand(e){
    ptr.x = e.clientX;
    ptr.y = e.clientY;
    ptr.moved = performance.now();
    ptr.touch = e.pointerType !== 'mouse';
    if(state === 'word' && armed && inReach(e)) explode(e.clientX, e.clientY);
    else if(state === 'gone' && inReach(e)) hush();
  }
  function lift(){ ptr.down = false; }
  document.addEventListener('pointermove', hand);
  document.addEventListener('pointerdown', function(e){
    if(e.pointerType !== 'mouse') ptr.down = true;
    hand(e);
  });
  document.addEventListener('pointerup', lift);
  document.addEventListener('pointercancel', lift);
  /* a cursor that leaves the window leaves the grains alone */
  document.addEventListener('pointerout', function(e){
    if(!e.relatedTarget){ ptr.down = false; ptr.moved = -1e9; }
  });

  window.addEventListener('resize', function(){
    if(!N) return;
    fit();
    var a = anchor(), k = a.size / size0;
    for(var i = 0; i < N; i++){
      HX[i] = a.x + (HX[i] - cx0) * k;
      HY[i] = a.y + (HY[i] - cy0) * k;
    }
    cx0 = a.x; cy0 = a.y; gap0 *= k; size0 = a.size;
  });
})();
</script>
</body>
</html>
